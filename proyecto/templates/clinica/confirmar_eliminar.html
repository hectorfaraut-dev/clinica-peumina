{% extends "base.html" %}
{% block title %}Confirmar eliminación — Clínica Peumina{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <strong><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</strong>
            </div>
            <div class="card-body">
                <p>¿Estás seguro/a de que deseas eliminar el siguiente registro?</p>
                <p class="fw-bold">{{ object }}</p>
                <p class="text-muted small">Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Sí, eliminar
                        </button>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
